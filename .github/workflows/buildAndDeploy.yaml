name: Deploy
on: deployment
jobs:
  build_job:
    runs-on: ubuntu-latest
    name: build dockers
    steps:
      - name: get environment
        run: |
          echo "environment is: $DEPLOY_ENVIRONMENT"
          URL=''
          case "$DEPLOY_ENVIRONMENT" in
            *dev1*)
              export URL=$DEV1_URL
              ;;
            *e2e*)
              export URL=$E2E_URL
              ;;
            *test*)
              export URL=$TEST_URL
              ;;
            *cicd*)
              export URL=$CICD_URL
              ;;
            **)
              echo "unknown environment. defaulting to cicd"
              export URL=$CICD_URL
              ;;
          esac
          echo URL=$URL >> $GITHUB_ENV
        env:
          DEPLOY_ENVIRONMENT: '${{ github.event.deployment.environment }}'
          CICD_URL: ${{ vars.CICD_URL }}
          DEV1_URL: ${{ vars.DEV1_URL }}
          E2E_URL: ${{ vars.E2E_URL }}
          TEST_URL: ${{ vars.TEST_URL }}
      - name: set deployment status to in progress
        id: start_deployment
        uses: octokit/request-action@v2.x
        with:
          route: POST /repos/:repository/deployments/:deployment/statuses
          repository: ${{ github.repository }}
          deployment: ${{ github.event.deployment.id }}
          environment: ${{ github.event.deployment.environment }}
          environment_url: https://${{ env.URL }}/hkube/dashboard-${{ github.event.deployment.payload.prName }}/
          log_url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          state: in_progress
          mediaType: '{"previews": ["flash", "ant-man"]}'
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
      - name: Checkout
        uses: actions/checkout@v2
      - uses: actions/setup-node@v2-beta
        with:
          node-version: '22'
      - name: Docker login
        run: echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USER }} --password-stdin
      - run: npm ci
      - name: build
        run: PRIVATE_REGISTRY=docker.io/hkube npm run build
        env:
          TRAVIS_PULL_REQUEST: 'true'
          PR_NAME: ${{ github.event.deployment.payload.prName }}
      - name: set deployment status to failure
        id: failed_deployment
        uses: octokit/request-action@v2.x
        if: failure()
        with:
          route: POST /repos/:repository/deployments/:deployment/statuses
          repository: ${{ github.repository }}
          deployment: ${{ github.event.deployment.id }}
          environment: ${{ github.event.deployment.environment }}
          environment_url: https://${{ env.URL }}/hkube/dashboard-${{ github.event.deployment.payload.prName }}/
          log_url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          mediaType: '{"previews": ["ant-man"]}'
          state: failure
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'

  deploy:
    runs-on: [self-hosted, hkube-self-hosted-simulator]
    needs: build_job
    name: deploy
    steps:
      - name: get environment
        run: |
          echo "running buildAndDeploy.yaml from environment: $DEPLOY_ENVIRONMENT"
          # single kubeconfig on the runner holds all cluster contexts; select via context
          case "$DEPLOY_ENVIRONMENT" in
            *dev1*)
              CONTEXT=dev1-spot.hkube.org
              URL=$DEV1_URL
              ;;
            *e2e*)
              CONTEXT=e2e.hkube.org
              URL=$E2E_URL
              ;;
            *test*)
              CONTEXT=test-spot.hkube.org
              URL=$TEST_URL
              ;;
            *cicd*)
              CONTEXT=cicd-spot.hkube.org
              URL=$CICD_URL
              ;;
            *)
              echo "unknown environment. defaulting to cicd"
              CONTEXT=cicd-spot.hkube.org
              URL=$CICD_URL
              ;;
          esac
          echo "selected context: $CONTEXT"
          export KUBECONFIG=/etc/hkube/kube/config
          kubectl config use-context "$CONTEXT"
          echo KUBECONFIG=/etc/hkube/kube/config >> $GITHUB_ENV
          echo URL=$URL >> $GITHUB_ENV
        env:
          DEPLOY_ENVIRONMENT: '${{ github.event.deployment.environment }}'
          CICD_URL: ${{ vars.CICD_URL }}
          DEV1_URL: ${{ vars.DEV1_URL }}
          E2E_URL: ${{ vars.E2E_URL }}
          TEST_URL: ${{ vars.TEST_URL }}
      - name: Checkout
        uses: actions/checkout@v2
      - name: verify kubectl
        run: kubectl cluster-info
      - name: deploy
        run: ./scripts/deploy-staging.sh
        env:
          PR_NAME: ${{ github.event.deployment.payload.prName }}
      - name: set deployment status to success
        id: successful_deployment
        uses: octokit/request-action@v2.x
        with:
          route: POST /repos/:repository/deployments/:deployment/statuses
          repository: ${{ github.repository }}
          deployment: ${{ github.event.deployment.id }}
          environment: ${{ github.event.deployment.environment }}
          environment_url: https://${{ env.URL }}/hkube/dashboard-${{ github.event.deployment.payload.prName }}/
          log_url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          mediaType: '{"previews": ["ant-man"]}'
          state: success
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
      - name: set deployment status to failure
        id: failed_deployment
        uses: octokit/request-action@v2.x
        if: failure()
        with:
          route: POST /repos/:repository/deployments/:deployment/statuses
          repository: ${{ github.repository }}
          deployment: ${{ github.event.deployment.id }}
          environment: ${{ github.event.deployment.environment }}
          environment_url: https://${{ env.URL }}/hkube/dashboard-${{ github.event.deployment.payload.prName }}/
          log_url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          mediaType: '{"previews": ["ant-man"]}'
          state: failure
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
